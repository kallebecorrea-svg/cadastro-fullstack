<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
</head>
<body>
    <h1>Cadastrar Cliente</h1>
    <form id="formCliente">
        <label for="nome">
            Nome:
            <input type="text" id="nome" required placeholder="apenas o primeiro nome">
        </label>
        <br><br>
        <label for="sobrenome">
            Sobrenome:
            <input type="text" id="sobrenome" required placeholder="apenas o último nome">
        </label>
        <br><br>
        <label for="email">
            E-mail
            <input type="email" required id="email">
        </label>
        <br><br>
        <label for="telefone">
            Telefone:
            <input type="text" id="telefone" required placeholder="somente números com o DDD" minlength="11" maxlength="11">
        </label>
        <br><br>
        <button type="submit">Salvar Dados</button>
    </form>
    <div id="msg"></div>
    <br><br>
    <button id="listarClientes">Listar Clientes</button>
    <br><br>
    <input type="number" id="idExcluir" required placeholder="ID do cliente a ser excluído" hidden>
    <br>
                                                                                                                    
    <button id="excluirClientes">Excluir Clientes</button>
    <button id="excluir" hidden>Excluir</button>

    <script src="/cadastro/front.js"></script>

</body>
</html>
